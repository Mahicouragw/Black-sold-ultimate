<!DOCTYPE html>
<html>
<head>
    <title>Reset Old Hero Data</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 600px; margin: 0 auto; }
        button { padding: 10px 20px; margin: 10px 0; cursor: pointer; }
        .success { color: green; }
        .error { color: red; }
        .info { background: #f0f0f0; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Reset Old Hero Data</h1>
    <p>This page will clear all old hero data from your browser.</p>
    
    <div class="info">
        <strong>What will be deleted:</strong>
        <ul>
            <li>All hero rosters (old format)</li>
            <li>All saved game data</li>
            <li>All cached hero information</li>
        </ul>
        <strong>What will be preserved:</strong>
        <ul>
            <li>Google authentication credentials</li>
            <li>Account settings</li>
            <li>Chat history</li>
        </ul>
    </div>
    
    <button onclick="resetData()">Clear Old Hero Data</button>
    <button onclick="window.location.href='index.html'">Return to Game</button>
    
    <div id="status"></div>
    
    <script>
        function resetData() {
            const status = document.getElementById('status');
            const oldKeys = [
                'black_sword_ultimate_save',
                'black_sword_hero_roster_v2',
                'black_sword_hero_roster',
                'black_sword_save',
                'black_sword_state'
            ];
            
            let deleted = 0;
            oldKeys.forEach(key => {
                if (localStorage.getItem(key)) {
                    localStorage.removeItem(key);
                    deleted++;
                }
                // Also remove account-specific versions
                for (let i = 0; i < localStorage.length; i++) {
                    const k = localStorage.key(i);
                    if (k && k.startsWith(key + ':')) {
                        localStorage.removeItem(k);
                        deleted++;
                    }
                }
            });
            
            status.innerHTML = `<div class="success">✓ Cleared ${deleted} old data entries. All hero data has been reset.</div>`;
            console.log(`Reset complete: ${deleted} entries cleared`);
        }
    </script>
</body>
</html>
