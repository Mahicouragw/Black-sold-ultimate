name: Web Build & Deploy (Vercel & GitHub Pages ready)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - run: npm ci || npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify bundle
        run: |
          test -f www/index.html && echo "web bundle OK"
          node scripts/pwa-check.mjs
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ./www
        continue-on-error: true

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: web
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
