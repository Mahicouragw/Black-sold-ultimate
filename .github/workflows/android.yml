name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ['android-*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: 21
      - name: Validate and build web assets
        run: |
          npm ci
          npm run pwa:check
          node scripts/security-check.mjs
          npm run build
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Normalize APK filename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BlackSwordUltimate.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BlackSwordUltimate.apk
          path: BlackSwordUltimate.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/android-')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: BlackSwordUltimate.apk
          generate_release_notes: true
