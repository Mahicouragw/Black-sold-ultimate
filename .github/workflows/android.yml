name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ['android-*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Validate and build web assets
        run: |
          npm ci
          npm run pwa:check
          npm run security
          npm run build
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Normalize APK filename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BlackSwordUltimate.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlackSwordUltimate.apk
          path: BlackSwordUltimate.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/android-')
        uses: softprops/action-gh-release@v2
        with:
          files: BlackSwordUltimate.apk
          generate_release_notes: true
