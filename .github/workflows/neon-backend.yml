name: Neon backend

on:
  workflow_dispatch:
    inputs:
      migrate:
        description: 'Apply the checked-in Neon schema after provisioning'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/neon-backend.yml'
      - 'scripts/neon-*.mjs'
      - 'neon/**'

permissions:
  contents: read
  actions: write

concurrency:
  group: neon-black-sword-backend
  cancel-in-progress: false

jobs:
  provision:
    name: Provision and verify claimable Neon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Provision or reconnect to the project
        env:
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ vars.NEON_BRANCH_ID }}
          NEON_PROJECT_EXPIRES_AT: ${{ vars.NEON_PROJECT_EXPIRES_AT }}
          NEON_IDENTITY_ASSERTION: ${{ secrets.NEON_IDENTITY_ASSERTION }}
        run: node scripts/neon-provision.mjs
      - name: Store project-scoped credentials
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/neon-store-credentials.mjs
      - name: Apply schema
        if: ${{ inputs.migrate || hashFiles('neon/schema.sql') != '' }}
        run: node scripts/neon-migrate.mjs
      - name: Verify auth, database, and security
        if: ${{ inputs.migrate || hashFiles('neon/schema.sql') != '' }}
        run: node scripts/verify-neon-backend.mjs
