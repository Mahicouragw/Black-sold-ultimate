name: Neon backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/neon-backend.yml'
      - 'scripts/neon-*.mjs'
      - 'scripts/verify-neon-backend.mjs'
      - 'neon/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: neon-black-sword-backend
  cancel-in-progress: false

jobs:
  provision:
    name: Provision, migrate, verify, and hand off Neon
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Provision the recoverable project
        if: ${{ hashFiles('neon/provision-enabled') != '' }}
        run: node scripts/neon-provision.mjs
      - name: Apply the complete Neon schema atomically
        if: ${{ hashFiles('neon/provision-enabled') != '' }}
        run: node scripts/neon-migrate.mjs
      - name: Refresh the Data API schema cache
        if: ${{ hashFiles('neon/provision-enabled') != '' }}
        run: node scripts/neon-refresh-schema.mjs
      - name: Verify auth, database features, OAuth, and RLS
        if: ${{ hashFiles('neon/provision-enabled') != '' }}
        run: node scripts/verify-neon-backend.mjs
      - name: Publish public configuration and encrypted claim handoff
        if: ${{ hashFiles('neon/provision-enabled') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/neon-handoff.mjs --wait
