name: Neon backend

on:
  workflow_dispatch:
    inputs:
      handoff_pr:
        description: Pull request number that receives the encrypted claim handoff
        required: true
        type: string
      wait_for_claim:
        description: Keep polling until a human completes the claim (up to 30 minutes)
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: neon-black-sword-backend
  cancel-in-progress: false

jobs:
  provision:
    name: Provision, migrate, verify, and hand off Neon
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate the committed handoff public key
        run: node -e "import('./scripts/neon-crypto.mjs').then(module => console.log('Handoff key id:', module.publicKeyId()))"
      - name: Provision the recoverable project
        run: node scripts/neon-provision.mjs
      - name: Publish the encrypted claim handoff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEON_HANDOFF_PR_NUMBER: ${{ inputs.handoff_pr }}
        run: node scripts/neon-handoff.mjs --publish-only
      - name: Apply the complete Neon schema atomically
        run: node scripts/neon-migrate.mjs
      - name: Refresh the Data API schema cache
        run: node scripts/neon-refresh-schema.mjs
      - name: Verify auth, database features, OAuth, and RLS
        run: node scripts/verify-neon-backend.mjs
      - name: Wait for the human claim
        if: ${{ inputs.wait_for_claim }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEON_HANDOFF_PR_NUMBER: ${{ inputs.handoff_pr }}
        run: node scripts/neon-handoff.mjs --wait
