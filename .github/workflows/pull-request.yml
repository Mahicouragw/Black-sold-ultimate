name: Pull request release gate

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: pr-release-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run validate
      - run: npm run security
      - run: npm run pwa:check
      - run: npm run build
      - name: Verify recorded-audio release assets
        run: |
          test -f www/recorded-audio-checksums.json
          test -f www/AUDIO_CREDITS.md
          test -f www/assets/audio/licenses/Starter-Kit-Racing-MIT.txt
          test -f www/assets/audio/sfx/goblin-reaction.ogg
          test -f www/assets/audio/sfx/eat.ogg
          test -f www/assets/audio/sfx/drink.ogg
