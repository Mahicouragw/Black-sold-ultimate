name: Voice health

# Asks the live game's voice endpoint to speak two words and reports whether the
# configured key really works. The key itself never leaves Vercel.
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check the live voice service
        run: |
          set -o pipefail
          url="https://black-sold-ultimate.vercel.app/api/tts"
          echo "Configuration:"
          curl -sS "$url" || true
          echo
          # Give the production deployment time to be promoted, then probe ONCE:
          # every probe is a real (quota-limited) speech request.
          sleep 120
          body=$(curl -sS "$url?probe=1" || true)
          echo "Probe: $body"
          if printf '%s' "$body" | grep -q '"ok":true'; then
            echo "The voice service is configured and speaking."
            exit 0
          fi
          # Out of free quota is a known limit, not a broken deployment: say so
          # without failing the release. Anything else is a real problem.
          if printf '%s' "$body" | grep -q '"error":"tts-quota"'; then
            echo "::warning::The voice key works but the free quota is used up; the game is using the device voice until it refills. See VOICE_SETUP.md."
            exit 0
          fi
          echo "The voice service did not speak. See VOICE_SETUP.md for what each error means."
          exit 1
